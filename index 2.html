<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><title>Lokalin Cafe • Attendance</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24231f;background:#f7f4ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:480px;margin:auto;min-height:100dvh;padding:24px 20px 105px}.brand{font-size:25px;font-weight:850;letter-spacing:-1.5px;line-height:.88}.brand small{display:block;font-size:19px}.top{display:flex;justify-content:space-between;align-items:center;margin:12px 0 30px}.avatar{width:42px;height:42px;background:#e8e2da;border:0;border-radius:50%;font-weight:750}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#847e74;font-weight:750}.heading{font-size:32px;letter-spacing:-1.4px;margin:8px 0 6px}.muted{color:#837d75;font-size:13px}.panel{background:#fff;border:1px solid #ebe6df;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 5px 22px #302a2010}.dark{background:#292721;color:#fff;border:0}.clock{font-size:52px;letter-spacing:-3px;font-weight:760;margin:8px 0}.pill{display:inline-flex;border-radius:50px;padding:6px 11px;background:#e6eee2;color:#406443;font-size:11px;font-weight:750}.dark .pill{background:#4c4941;color:#e5e1d6}.bigbtn{width:100%;padding:19px;border-radius:19px;background:#292721;color:white;border:0;text-align:left;display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:17px;margin:12px 0}.bigbtn.secondary{background:transparent;color:#292721;border:1px solid #cfc8bd}.bigbtn small{display:block;font-size:12px;font-weight:450;opacity:.65;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.stat{border-radius:20px;padding:17px;background:#e8efe3}.stat:nth-child(2){background:#faf0d9}.stat:nth-child(3){background:#e6ebf1}.stat:nth-child(4){background:#f7e5df}.stat strong{display:block;font-size:31px;margin-top:9px}.stat span{font-size:12px;font-weight:700}.section{display:flex;align-items:center;justify-content:space-between;margin-top:26px}.section h3{font-size:18px;letter-spacing:-.5px}.staff{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eeeae5}.staff:last-child{border:0}.initial{width:43px;height:43px;border-radius:50%;background:#eae5df;display:grid;place-items:center;font-weight:750;flex-shrink:0}.staff .name{font-weight:750;font-size:14px}.staff .role{font-size:12px;color:#847e75;margin-top:3px}.staff .status{margin-left:auto;font-size:11px;border-radius:50px;padding:6px 9px;background:#f1eee9;white-space:nowrap}.status.ok{background:#e3efde;color:#426a42}.status.late{background:#fae8bf;color:#926000}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;justify-content:space-around;padding:12px 8px max(18px,env(safe-area-inset-bottom));background:#fbf9f6ed;backdrop-filter:blur(14px);border-top:1px solid #e9e3dc;z-index:5}.nav button{border:0;background:none;color:#8b857e;font-size:11px;min-width:65px;padding:6px}.nav button.active{color:#25241f;font-weight:800}.nav b{display:block;font-size:22px;margin-bottom:5px}input,select{width:100%;padding:14px;border:1px solid #ddd6cc;border-radius:14px;background:#fff;color:#292721;margin:7px 0 14px}.label{font-size:12px;font-weight:750}.hidden{display:none!important}.tinybtn{border:1px solid #ddd5c9;border-radius:12px;padding:10px 12px;background:white;color:#292721;font-size:12px;font-weight:750}.empty{text-align:center;padding:35px 15px;color:#8c8479}.notice{padding:13px;background:#f0e9db;border-radius:13px;font-size:12px;line-height:1.6;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.splash{min-height:85dvh;display:flex;flex-direction:column;justify-content:space-between;padding-top:60px}.splash h1{font-size:46px;letter-spacing:-2px;line-height:1.08}.splash .art{height:210px;border-radius:25px;background:linear-gradient(145deg,#d9cfbf,#a99b84);display:grid;place-items:center;font-size:80px;color:#ffffff99}.danger{color:#9a3d2e}.footnote{font-size:11px;color:#999087;line-height:1.5} @media(min-width:700px){body{background:#e9e4dc}.app{background:#f7f4ef;box-shadow:0 0 60px #0001}}
</style></head><body><main class="app"><div id="login" class="splash"><div><div class="brand">lokalin<small>cafe</small></div><h1>Absensi<br>Karyawan.</h1><p class="muted">Satu tempat untuk kehadiran, jadwal, dan laporan tim Lokalin Cafe.</p><div class="art">☕</div></div><div class="panel"><label class="label" for="who">Masuk sebagai</label><select id="who"></select><button class="bigbtn" onclick="enter()"><span>Masuk aplikasi<small>Kelola kehadiran hari ini</small></span>→</button><p class="footnote">Mode demo lokal. Belum ada autentikasi akun atau sinkronisasi antar perangkat.</p></div></div><div id="main" class="hidden"><div class="top"><div class="brand">lokalin<small>cafe</small></div><button class="avatar" onclick="logout()" title="Ganti pengguna">↪</button></div><section id="home"></section><section id="team" class="hidden"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section><nav class="nav"><button data-tab="home" onclick="tab('home')" class="active"><b>⌂</b>Beranda</button><button data-tab="team" onclick="tab('team')"><b>♧</b>Karyawan</button><button data-tab="history" onclick="tab('history')"><b>▤</b>Riwayat</button><button data-tab="settings" onclick="tab('settings')"><b>⚙</b>Pengaturan</button></nav></div></main><script>
const people=[{id:'ardi',name:'Ardi',role:'Chef',division:'Kitchen'},{id:'junaedi',name:'Junaedi',role:'Asisten Chef',division:'Kitchen'},{id:'ilham',name:'Ilham',role:'Helper Kitchen',division:'Kitchen'},{id:'wasih',name:'Wasih',role:'Head Bar',division:'Bar'},{id:'lilis',name:'Lilis',role:'Barista',division:'Bar'},{id:'pipit',name:'Pipit',role:'Server',division:'Service'}];
const KEY='lokalin_attendance_v3';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{records:[],shift:'16:00',end:'00:00'}}catch(e){db={records:[],shift:'16:00',end:'00:00'}};let current=null,active='home';const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Makassar'}),clock=()=>new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit',hour12:false}),dateLabel=()=>new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Makassar',weekday:'long',day:'numeric',month:'long',year:'numeric'}),person=id=>people.find(p=>p.id===id),rec=(id,d=today())=>db.records.find(r=>r.id===id&&r.date===d),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('who').innerHTML='<option value="admin">Admin / Owner</option>'+people.map(p=>`<option value="${p.id}">${p.name} — ${p.role}</option>`).join('');
function enter(){current=$('who').value;$('login').classList.add('hidden');$('main').classList.remove('hidden');tab('home')}function logout(){current=null;$('main').classList.add('hidden');$('login').classList.remove('hidden')}
function tab(t){active=t;['home','team','history','settings'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function check(type){if(current==='admin')return;let r=rec(current);if(type==='in'&&r?.in)return alert('Anda sudah check-in hari ini.');if(type==='out'&&!r?.in)return alert('Lakukan check-in dahulu.');if(type==='out'&&r?.out)return alert('Anda sudah check-out.');if(type==='in'){db.records.push({id:current,date:today(),in:clock(),out:'',note:''})}else r.out=clock();save();render()}
function late(r){return !!(r?.in&&r.in>db.shift)}function status(r){if(!r)return '<span class="status">Belum absen</span>';if(r.note)return `<span class="status">${esc(r.note)}</span>`;return `<span class="status ${late(r)?'late':'ok'}">${late(r)?'Terlambat':'Hadir'} ${esc(r.in||'')}</span>`}
function staffRow(p,d=today()){let r=rec(p.id,d);return `<div class="staff"><div class="initial">${p.name[0]}</div><div><div class="name">${p.name}</div><div class="role">${p.role} · ${p.division}</div></div>${status(r)}</div>`}
function render(){if(!current)return;let admin=current==='admin',r=rec(current),p=person(current),rs=people.map(x=>rec(x.id));$('home').innerHTML=admin?`<div class="eyebrow">Overview hari ini</div><h1 class="heading">Dashboard</h1><p class="muted">${dateLabel()}</p><div class="grid"><div class="stat"><span>♧ Hadir</span><strong>${rs.filter(x=>x?.in).length}</strong></div><div class="stat"><span>◷ Terlambat</span><strong>${rs.filter(late).length}</strong></div><div class="stat"><span>▤ Izin</span><strong>${rs.filter(x=>x?.note==='Izin').length}</strong></div><div class="stat"><span>○ Belum absen</span><strong>${rs.filter(x=>!x).length}</strong></div></div><div class="section"><h3>Kehadiran hari ini</h3><span class="muted">6 karyawan</span></div><div class="panel">${people.map(x=>staffRow(x)).join('')}</div><div class="notice">Status terlambat dibandingkan dengan jam mulai shift yang diatur. Belum absen tidak otomatis berarti tidak hadir.</div>`:`<div class="eyebrow">Selamat datang kembali</div><h1 class="heading">Halo, ${p.name} 👋</h1><p class="muted">${p.role} · ${p.division}</p><div class="panel dark"><div class="row"><span>${dateLabel()}</span><span class="pill">${r?.out?'Selesai':r?.in?'Sedang bekerja':'Belum absen'}</span></div><div class="clock" id="liveClock">${clock()}</div><span style="opacity:.7;font-size:12px">Waktu Indonesia Tengah (WITA)</span></div><button class="bigbtn" onclick="check('in')" ${r?.in?'disabled':''}><span>◉ &nbsp; Check In<small>Mulai kerja hari ini</small></span>→</button><button class="bigbtn secondary" onclick="check('out')" ${!r?.in||r?.out?'disabled':''}><span>↪ &nbsp; Check Out<small>Akhiri jam kerja</small></span>→</button><div class="panel"><div class="section" style="margin:0"><h3>Jadwal hari ini</h3><span class="pill">Shift</span></div><p>◷ &nbsp; ${db.shift} – ${db.end} WITA</p><div class="row muted"><span>Masuk: ${r?.in||'—'}</span><span>Pulang: ${r?.out||'—'}</span></div></div>`;
$('team').innerHTML=`<div class="eyebrow">Tim Lokalin</div><h1 class="heading">Karyawan</h1><p class="muted">6 anggota tim aktif</p><div class="panel">${people.map(x=>staffRow(x)).join('')}</div>${admin?'<div class="notice">Untuk memperbarui daftar karyawan secara permanen, versi online akan memerlukan manajemen akun.</div>':''}`;
let records=db.records.filter(x=>admin||x.id===current).slice().sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id));$('history').innerHTML=`<div class="eyebrow">Rekap kehadiran</div><h1 class="heading">Riwayat</h1><p class="muted">Catatan absensi tersimpan di perangkat ini.</p><button class="tinybtn" onclick="exportCSV()">↓ Ekspor CSV</button><div class="panel">${records.length?records.map(x=>`<div class="staff"><div class="initial">${person(x.id)?.name[0]||'?'}</div><div><div class="name">${esc(person(x.id)?.name||x.id)}</div><div class="role">${esc(x.date)} · ${esc(x.in||'—')} – ${esc(x.out||'—')}</div></div>${status(x)}</div>`).join(''):'<div class="empty">Belum ada riwayat absensi.</div>'}</div>`;
$('settings').innerHTML=`<div class="eyebrow">Pengaturan aplikasi</div><h1 class="heading">Pengaturan</h1><div class="panel"><div class="label">Pengguna aktif</div><p><b>${admin?'Admin / Owner':p.name+' · '+p.role}</b></p><div class="label">Jam masuk shift</div><input id="shift" type="time" value="${db.shift}" ${admin?'':'disabled'}><div class="label">Jam pulang shift</div><input id="end" type="time" value="${db.end}" ${admin?'':'disabled'}>${admin?'<button class="bigbtn" onclick="setShift()">Simpan jadwal →</button>':'<p class="muted">Hanya admin yang dapat mengubah shift.</p>'}</div>${admin?`<div class="panel"><h3>Koreksi kehadiran</h3><p class="muted">Tandai izin untuk hari ini jika karyawan tidak masuk.</p><select id="staffSelect">${people.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button class="tinybtn" onclick="markLeave()">Tandai izin</button></div>`:''}<div class="notice"><b>Mode lokal / prototipe:</b> data hanya tersimpan di browser perangkat ini. Belum aman untuk payroll resmi atau absensi multi-HP. Tidak ada login terverifikasi, lokasi GPS, maupun server.</div><button class="tinybtn" onclick="logout()">Ganti pengguna</button>`}
function setShift(){db.shift=$('shift').value;db.end=$('end').value;save();render();alert('Jadwal tersimpan.')}function markLeave(){let id=$('staffSelect').value,r=rec(id);if(r?.in)return alert('Karyawan sudah check-in.');if(!r){r={id,date:today(),in:'',out:'',note:'Izin'};db.records.push(r)}else r.note='Izin';save();render()}
function exportCSV(){let arr=db.records.filter(x=>current==='admin'||x.id===current).sort((a,b)=>a.date.localeCompare(b.date));let lines=[['Tanggal','Nama','Jabatan','Divisi','Masuk','Pulang','Status'],...arr.map(r=>{let p=person(r.id);return [r.date,p?.name||r.id,p?.role||'',p?.division||'',r.in||'',r.out||'',r.note||(!r.in?'Belum absen':late(r)?'Terlambat':'Hadir')]})];let csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lokalin-absensi-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}setInterval(()=>{let e=$('liveClock');if(e)e.textContent=clock()},15000);
</script></body></html>
